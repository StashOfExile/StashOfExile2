# StashOfExile2 window rules for Hyprland (classic .conf) - see linux/README.md.
# The main window's class is "Stashofexile2" (Tk capitalises tk.Tk(className="StashOfExile2")).
windowrulev2 = float, class:^(Stashofexile2)$
windowrulev2 = center, class:^(Stashofexile2)$
windowrulev2 = size 1400 1000, class:^(Stashofexile2)$
# Its own pop-up windows (borderless Tk toplevels under XWayland)
windowrulev2 = float, class:^(Toplevel)$, xwayland:1
# Optional: tell the app a key press through Hyprland (bindn: the game still gets the key). Only needed when the
# app doesn't hear the key by itself (--check-linux, line "Keys"). Change the path to where you unpacked it.
# bindn = CTRL SHIFT, R, exec, ~/StashOfExile2/StashOfExile2 --key "Ctrl+Shift+R"
