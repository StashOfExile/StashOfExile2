<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- StashOfExile2 on Linux: the Windows font names the app asks for -> fonts Linux has. Read by this app only
     (the launcher sets FONTCONFIG_FILE to this file; SOE2_SYSTEM_FONTS=1 turns it off) - player-tested on
     Arch + Hyprland. The first family installed wins. -->
<fontconfig>
 <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
 <match target="pattern"><test name="family" qual="any"><string>Segoe UI</string></test>
  <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string><string>Noto Sans</string><string>DejaVu Sans</string></edit>
 </match>
 <match target="pattern"><test name="family" qual="any"><string>Segoe UI Semibold</string></test>
  <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string><string>Noto Sans</string><string>DejaVu Sans</string></edit>
  <edit name="weight" mode="assign" binding="strong"><const>semibold</const></edit>
 </match>
 <match target="pattern"><test name="family" qual="any"><string>Segoe UI Light</string></test>
  <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string><string>Noto Sans</string><string>DejaVu Sans</string></edit>
  <edit name="weight" mode="assign" binding="strong"><const>light</const></edit>
 </match>
 <match target="pattern"><test name="family" qual="any"><string>Segoe UI Black</string></test>
  <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string><string>Noto Sans</string><string>DejaVu Sans</string></edit>
  <edit name="weight" mode="assign" binding="strong"><const>black</const></edit>
 </match>
 <match target="pattern"><test name="family" qual="any"><string>Tahoma</string></test>
  <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string><string>Noto Sans</string><string>DejaVu Sans</string></edit>
 </match>
 <match target="pattern"><test name="family" qual="any"><string>sans-serif</string></test>
  <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string><string>Noto Sans</string><string>DejaVu Sans</string></edit>
 </match>
 <match target="pattern"><test name="family" qual="any"><string>Consolas</string></test>
  <edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string><string>Noto Sans Mono</string><string>DejaVu Sans Mono</string></edit>
 </match>
 <match target="pattern"><test name="family" qual="any"><string>Lucida Console</string></test>
  <edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string><string>Noto Sans Mono</string><string>DejaVu Sans Mono</string></edit>
 </match>
</fontconfig>
