# StashOfExile2 community board. Deployed by .github/workflows/board.yml.
name = "soe2-board"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
REPORT_HIDE = "3"          # distinct reports that hide a post until an admin looks at it
POSTS_PER_DAY = "10"       # per player
JOINS_PER_DAY = "5"        # new board accounts per internet address per day
BUGS_PER_DAY = "5"
AUTO_EVENTS = "1"          # 3.3.0: leagues, Twitch Drops, events and races from Steam news go live on their own; "0": drafts         # bug reports per internet address per day (2.48.0)

[triggers]
crons = ["7 * * * *"]      # 3.3.0: once an hour - GGG's patch-notes forum

[[d1_databases]]
binding = "DB"
database_name = "soe2-board"
database_id = "REPLACE_WITH_YOUR_D1_ID"     # filled in at deploy
