# Builds StashOfExile2.exe on GitHub's own Windows machine and publishes a release (same steps as build_exe.bat).
# Runs when main gets a new version: the version in stashofexile2.py (APP_VERSION) that has no "v<version>" tag yet.
# It makes that tag, builds the exe and publishes it as the FULL release (3.0.3: no previews - every version is built
# and tested locally first, then merged), so everyone's "Check for updates" finds it. The notes start with the
# "Coming from 2.x?" box (.github/notice-2x.md).
# Nothing happens for changes that don't change the version. Also runs by hand (Actions > Release > Run workflow).
name: Release

on:
  push:
    branches: [main]
    paths: ["stashofexile2.py", "soe2/__init__.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:                       # (3.0.5: for the Linux job below - the Windows steps are unchanged)
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Read the version, and stop if it's already released
        id: ver
        shell: bash
        run: |
          APP=$(python -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('stashofexile2.py', encoding='utf-8').read()).group(1))")
          PKG=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('soe2/__init__.py', encoding='utf-8').read()).group(1))")
          echo "launcher $APP, soe2 $PKG"
          if [ "$APP" != "$PKG" ]; then echo "::error::APP_VERSION $APP and __version__ $PKG differ"; exit 1; fi
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v$APP" >/dev/null; then
            echo "v$APP is already released - nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$APP" >> "$GITHUB_OUTPUT"

      - name: Install the build tools
        if: steps.ver.outputs.skip == 'false'
        run: python -m pip install -r requirements-build.txt     # exact versions, see the file. Before the checks: the screen-read check loads the app

      - name: GGG policy checks before anything is built
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python tools/check_tos.py
          python tools/check_screenread.py
          python tools/check_rmt.py

      - name: Build StashOfExile2.exe
        if: steps.ver.outputs.skip == 'false'
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name StashOfExile2 --icon stashofexile2.ico
          --collect-submodules soe2
          --add-data "modlists.json;." --add-data "gamedata.json;." --add-data "regexdata.json;."
          --add-data "default_rules.json;." --add-data "searchdata.json;." --add-data "anointdata.json;." --add-data "cxnames.json;." --add-data "gamedb.json;." --add-data "gamedb_hide.json;." --add-data "atlasmasters.json;." --add-data "moneymakers.json;." --add-data "mapdata.json;." --add-data "campaign.json;." --add-data "crafthelper.json;." --add-data "tierdata.json;." --add-data "themes;themes" --add-data "stashofexile2.ico;."
          --add-data "soe2\ritual_glyphs.json;soe2" --add-data "soe2\sekhemas.json;soe2" --add-data "soe2\fonts;soe2\fonts" --hidden-import pystray._win32 --hidden-import PIL._tkinter_finder
          --hidden-import cv2 --hidden-import mss --hidden-import numpy --collect-submodules winrt stashofexile2.py

      # 3.0.6 (an installer too, with the portable option kept): Setup-StashOfExile2-<version>.exe -
      # per user (no admin), Start menu, Settings > Apps, uninstaller (installer/StashOfExile2.iss). Its name doesn't
      # start with "StashOfExile2", so older apps' updater still takes the portable exe.
      - name: Build the installer (Inno Setup)
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\StashOfExile2.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Make the build kit zip and the release notes
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          V="${{ steps.ver.outputs.version }}"
          git archive --format=zip -o "StashOfExile2_build_kit_$V.zip" HEAD
          python tools/check_tos.py
          python tools/check_version.py
          python tools/release_notes.py "$V" > notes.md
          cat notes.md

      # 2.132.8 (feedback: a VirusTotal link and checksums): SHA-256 of each download (SHA256SUMS.txt + the notes),
      # and the exe sent to VirusTotal so the notes can link its scan. No VT_API_KEY secret = no scan link, the rest
      # still happens.
      - name: Checksums and VirusTotal scan
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          cp dist/StashOfExile2.exe StashOfExile2.exe
          cp "dist/Setup-StashOfExile2-$V.exe" "Setup-StashOfExile2-$V.exe"
          sha256sum StashOfExile2.exe "Setup-StashOfExile2-$V.exe" "StashOfExile2_build_kit_$V.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          EXE=$(sha256sum StashOfExile2.exe | cut -d' ' -f1)
          ZIP=$(sha256sum "StashOfExile2_build_kit_$V.zip" | cut -d' ' -f1)
          VT=""
          if [ -n "$VT_API_KEY" ]; then
            URL=$(curl -s --fail -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url \
                  | python -c "import json,sys;print(json.load(sys.stdin)['data'])") || URL=""
            if [ -n "$URL" ] && curl -s --fail -H "x-apikey: $VT_API_KEY" -F "file=@StashOfExile2.exe" "$URL" >/dev/null; then
              VT="https://www.virustotal.com/gui/file/$EXE"
            else
              echo "::warning::VirusTotal upload failed - no scan link this time"
            fi
          fi
          SETUP=$(sha256sum "Setup-StashOfExile2-$V.exe" | cut -d' ' -f1)
          python tools/release_notes.py "$V" --sha "$EXE" "$ZIP" --setup "$SETUP" --vt "$VT" > body.md
          cat .github/notice-2x.md body.md > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        if: steps.ver.outputs.skip == 'false'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: StashOfExile2 v${{ steps.ver.outputs.version }}
          body_path: notes.md
          make_latest: true         # 3.0.3: full release (tested locally first, no previews)
          prerelease: false
          files: |
            dist/StashOfExile2.exe
            dist/Setup-StashOfExile2-*.exe
            StashOfExile2_build_kit_*.zip
            SHA256SUMS.txt

  # 3.0.5 (owner: merge into main, provided it creates no issues for Windows builds): the Linux build, after the
  # Windows release is published, onto the SAME full release - StashOfExile2-<version>-linux.tar.gz + its checksum.
  # Its own job and machine: if it fails, the Windows release is already out and untouched. (Was linux-build.yml on
  # the linux branch, with its own pre-releases.)
  linux:
    needs: build
    if: needs.build.outputs.skip == 'false'
    runs-on: ubuntu-24.04          # system Python 3.12 + Tk 8.6.14: setup-python's Tk crashed under Xvfb on 22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      V: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      - name: Install the system packages (Tk, Xvfb, the Linux helpers' tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.12 python3.12-venv python3.12-dev python3-tk \
            tcl8.6 tk8.6 libxft2 fontconfig fonts-dejavu-core xvfb xauth xdotool xclip tesseract-ocr tesseract-ocr-eng
          python3.12 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install the build tools
        run: python -m pip install -r linux/requirements-linux.txt     # exact versions (see the file)

      - name: Tests (headless)
        env:
          PYTHONUTF8: "1"
        run: xvfb-run -a -s "-screen 0 1920x1200x24" bash tests/runall.sh

      - name: Build and smoke-run the binary
        run: PYTHON=python SMOKE=1 ./build_linux.sh          # no display here: build_linux.sh uses xvfb-run

      - name: Add it to the release
        run: |
          cp dist/SHA256SUMS dist/SHA256SUMS-linux.txt
          gh release upload "v$V" "dist/StashOfExile2-$V-linux.tar.gz" dist/SHA256SUMS-linux.txt --clobber
          SUM=$(cut -d' ' -f1 dist/SHA256SUMS)
          gh release view "v$V" --json body -q .body > body.md
          if ! grep -q "### Linux" body.md; then
            {
              echo
              echo "### Linux"
              echo "\`StashOfExile2-$V-linux.tar.gz\` (built on Ubuntu 24.04; tested on Arch + Hyprland). Install and limits:"
              echo "[linux/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/v$V/linux/README.md)."
              echo
              echo "SHA-256: \`$SUM\`"
            } >> body.md
            gh release edit "v$V" --notes-file body.md
          fi
