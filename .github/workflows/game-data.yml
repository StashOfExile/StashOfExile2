# 3.3.0 owner: the game data keeps itself current. Once a day this checks RePoE and Path of Building for a new
# export. Nothing new: it stops. New: it runs tools/update_game_data.py - nothing is ever removed, new items are
# marked, a big drop stops the run - then the data tests, and opens ONE pull request, auto/game-data.
# Owner, 25 Nov 2026: hands off. When the tests pass and no item went missing from the game files, the pull request
# merges itself, and every app takes the new data from main within a day (soe2/datasync.py, data_manifest.json) -
# no release needed. Anything odd is left open for the owner, and GitHub emails him. A failed run emails him too.
# Behind on merging? The same pull request is brought up to date each day, and every patch's snapshot already in
# it is carried along, so a skipped patch is never lost. Run it by hand too: Actions > Game data > Run.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Game data

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: game-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: auto/game-data
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with: {python-version: "3.12"}

      - name: Get the sources
        run: |
          git clone --depth 1 https://github.com/repoe-fork/poe2.git ../repoe
          git clone --depth 1 --filter=blob:none --sparse https://github.com/PathOfBuildingCommunity/pathofbuilding-poe2.git ../pob
          git -C ../pob sparse-checkout set src/Data/Uniques src/TreeData
          echo "REPOE=$(git -C ../repoe rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "POB=$(git -C ../pob rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Anything new?
        id: new
        run: |
          seen=$(python -c "import json;d=json.load(open('data_sources.json'));print(d.get('repoe',''),d.get('pob',''))" 2>/dev/null || echo "")
          if [ "$seen" = "$REPOE $POB" ]; then echo "Nothing new."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Keep the snapshots already waiting in the pull request
        if: steps.new.outputs.go == 'yes'
        run: |
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH"
            git checkout "origin/$BRANCH" -- snapshots/ || true
          fi

      - name: Update the game data
        if: steps.new.outputs.go == 'yes'
        run: |
          python tools/update_game_data.py --repoe ../repoe/data --pob ../pob
          python -c "import json;json.dump({'repoe':'$REPOE','pob':'$POB'},open('data_sources.json','w'),indent=1)"
          python tools/build_data_manifest.py

      - name: Data tests
        if: steps.new.outputs.go == 'yes'
        run: |
          sudo apt-get install -y -qq xvfb python3-tk >/dev/null
          pip install -q -r requirements-build.txt || true
          xvfb-run -a python -m unittest tests.test_gamedb tests.test_uniquedata tests.test_gamesnap \
            tests.test_update_game_data tests.test_changed_in tests.test_modlab_kinds tests.test_datasync

      - name: One pull request for the owner
        if: steps.new.outputs.go == 'yes'
        run: |
          git config user.name "soe2 game data"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A gamedb.json modlists.json regexdata.json tierdata.json trialdata.json mapdata.json \
            uniquedata.json gamedata.json anointdata.json snapshots soe2/config.py data_sources.json data_manifest.json
          if git diff --cached --quiet; then echo "No data changed."; exit 0; fi
          git commit -q -m "Game data: RePoE ${REPOE:0:7}, Path of Building ${POB:0:7}"
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main --title "Game data update" --body-file _update_report.md
          else
            gh pr edit "$BRANCH" --body-file _update_report.md
          fi
          # hands off: merge when nothing went missing from the game files; else it waits for the owner
          if grep -qE "[1-9][0-9]* kept though not in the new files" _update_report.md; then
            gh pr comment "$BRANCH" --body "Some items are no longer in the game files. They are kept and marked; please look before merging."
          else
            gh pr merge "$BRANCH" --squash --delete-branch
          fi
