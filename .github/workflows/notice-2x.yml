# 3.0.0: puts the "Coming from 2.x? Download this one by hand, once." box (.github/notice-2x.md) at the top of a
# release's notes. 2.x apps can't download from the new GitHub home by themselves, so their players read this.
# Actions > Notice for 2.x players > Run workflow. Running it twice changes nothing.
name: Notice for 2.x players

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v3.0.0"

permissions:
  contents: write

jobs:
  notice:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Add the notice to the release notes
        run: |
          gh release view "$TAG" --json body -q .body > body.md
          if grep -q "Coming from 2.x" body.md; then echo "Already there."; exit 0; fi
          cat .github/notice-2x.md body.md > notes.md
          gh release edit "$TAG" --notes-file notes.md
          echo "Added to $TAG."
